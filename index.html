<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GameForge AI</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>GameForge AI</h1>

<p>
AI Game Development System
</p>

</header>



<main>


<section id="dashboard">

<h2>AI Dashboard</h2>

<div id="aiStatus">
起動準備中...
</div>

</section>



<section>

<h2>System Console</h2>

<pre id="log">
待機中...
</pre>

</section>



<section id="aiChat">

<h2>AI Chat</h2>

<div id="apiKeyBar">
<input id="apiKeyInput" type="password" placeholder="OpenAI APIキーを貼り付け">
<button id="apiKeySaveButton">保存</button>
</div>

<div id="chat" class="chat-messages"></div>

<div class="chat-input-row">
<input id="chatInput" type="text" placeholder="作りたいゲームの内容を入力...">
<button id="sendButton">送信</button>
</div>

</section>



<section id="filesSection">

<h2>Project Files</h2>

<div id="fileList"></div>

</section>


</main>



<script type="module" src="./js/app.js"></script>
<script type="module" src="./js/chatController.js"></script>


</body>

</html>
